<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Generator</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --accent-gold: #f59e0b;
      --accent-blue: #1f2937;
      --accent-blue-hover: #374151;
      --danger-red: #ef4444;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid #2d1e2f;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .icon-container {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #451a28;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: var(--danger-red);
      font-size: 20px;
      font-weight: bold;
    }

    h2 {
      font-size: 1.25rem;
      margin: 0 0 16px 0;
      color: #ffffff;
    }

    p.error-message {
      font-size: 0.9rem;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      border: none;
      border-radius: 20px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent-gold);
      color: #000000;
    }

    .btn-primary:hover {
      background-color: #d97706;
    }

    .btn-secondary {
      background-color: #1e293b;
      color: #94a3b8;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }
  </style>
</head>
<body>

  <div class="modal-card" id="errorModal">
    <div class="icon-container">!</div>
    <h2>Generation Issue Encountered</h2>
    <p class="error-message" id="errorMessageText">
      The model `llama-3.3-70b-versatile` does not exist or you do not have access to it.
    </p>
    <div class="button-group">
      <button class="btn btn-primary" onclick="retryGeneration()">Try Again</button>
      <button class="btn btn-secondary" onclick="openApiKeyModal()">Set API Key</button>
    </div>
  </div>

  <script>
    let sessionApiKey = "";

    function openApiKeyModal() {
      const key = prompt("Please enter your GroqCloud API Key:");
      if (key) {
        sessionApiKey = key.trim();
        localStorage.setItem('groq_api_key', sessionApiKey);
        alert("API Key saved.");
      }
    }

    function retryGeneration() {
      document.getElementById('errorModal').style.display = 'none';
      alert("Retrying request...");
    }

    async function executeGroqRequest(prompt, schema = null, model = "llama-3.1-8b-instant") {
      let apiKey = sessionApiKey || localStorage.getItem('groq_api_key');
      
      if (!apiKey) {
        openApiKeyModal();
        throw new Error("API Key required. Please enter your GroqCloud API key.");
      }

      const payload = {
        model: model,
        messages: [
          {
            role: "user",
            content: prompt
          }
        ],
        temperature: 0.7
      };

      if (schema) {
        payload.response_format = { type: "json_object" };
      }

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          if (response.status === 401) {
            localStorage.removeItem('groq_api_key');
            sessionApiKey = "";
          }
          throw new Error(errData?.error?.message || `Groq API Error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        const content = data.choices[0]?.message?.content;

        if (!content) {
          throw new Error("Empty response received from Groq.");
        }

        return schema ? JSON.parse(content) : content;
      } catch (err) {
        throw err;
      }
    }

    // Alias for compatibility
    const executeGeminiRequest = executeGroqRequest;
  </script>
</body>
</html>
